<svg
  xmlns="http://www.w3.org/2000/svg"
  width="96"
  height="96"
  viewBox="0 0 96 96"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">CronDelta</title>
  <desc
    id="description"
  >A clock containing two schedule timelines. Their first occurrences align; the last occurrence differs.</desc>
  <style>
    .ink { stroke: #334155; }
    .event { fill: #334155; }
    .delta { fill: #0f766e; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #cbd5e1; }
      .event { fill: #cbd5e1; }
      .delta { fill: #5eead4; }
    }
  </style>
  <g class="ink" fill="none" stroke-width="2.5" stroke-linecap="round">
    <circle cx="48" cy="48" r="38" />
    <path d="M48 20v12h11M24 48h48M24 64h48" />
  </g>
  <g class="event">
    <circle cx="30" cy="48" r="3.5" />
    <circle cx="46" cy="48" r="3.5" />
    <circle cx="30" cy="64" r="3.5" />
    <circle cx="46" cy="64" r="3.5" />
  </g>
  <g class="delta">
    <circle cx="62" cy="48" r="4" />
    <circle cx="72" cy="64" r="4" />
  </g>
</svg>
