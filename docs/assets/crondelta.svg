<svg
  xmlns="http://www.w3.org/2000/svg"
  width="96"
  height="96"
  viewBox="0 0 96 96"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">CronDelta</title>
  <desc
    id="description"
  >A clock face holding two schedule timelines. Their first two occurrences align; the third one on the lower timeline is shifted.</desc>
  <style>
    .ink { stroke: #334155; }
    .event { fill: #334155; }
    .delta { fill: #0d9488; }
    .shift { stroke: #0d9488; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #cbd5e1; }
      .event { fill: #cbd5e1; }
      .delta { fill: #5eead4; }
      .shift { stroke: #5eead4; }
    }
  </style>
  <g class="ink" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="48" cy="48" r="40" />
    <path d="M48 17v10" />
  </g>
  <g class="ink" fill="none" stroke-width="2.5" stroke-linecap="round" opacity=".45">
    <path d="M24 44h48M24 62h48" />
  </g>
  <g class="event">
    <circle cx="32" cy="44" r="4.5" />
    <circle cx="48" cy="44" r="4.5" />
    <circle cx="64" cy="44" r="4.5" />
    <circle cx="32" cy="62" r="4.5" />
    <circle cx="48" cy="62" r="4.5" />
  </g>
  <path class="shift" d="M64 50v12h3" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle class="delta" cx="72" cy="62" r="6" />
</svg>
